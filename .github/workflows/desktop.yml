# Checks the Synergy app (clients/app) and builds its installers for Windows, macOS and
# Linux. Every run uploads the installers as workflow artifacts. Pushing an app-v* tag (for
# example app-v0.2.0, matching the version in tauri.conf.json) also signs them, notarizes the
# macOS build and drafts a GitHub release. Signing uses the secrets listed in
# clients/app/RELEASING.md and is skipped, with a warning, for any platform whose secrets are
# not set yet.
name: desktop

on:
  pull_request:
    paths: ["clients/app/**", "packages/config/apps.json", "packages/shell/assets/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["clients/app/**", "packages/config/apps.json", "packages/shell/assets/**", ".github/workflows/desktop.yml"]
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app/src-tauri
      - run: npm ci
      - run: npm run build:web
      - run: cargo fmt --check
        working-directory: clients/app/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: clients/app/src-tauri
      - run: cargo test
        working-directory: clients/app/src-tauri

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/app
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app/src-tauri
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/app-v')
        name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "${GITHUB_REF_NAME#app-v}" = "$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }
      - if: startsWith(github.ref, 'refs/tags/app-v') && matrix.name == 'macos'
        name: Set up macOS signing and notarization
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Tauri signs when APPLE_CERTIFICATE is set and notarizes with the App Store Connect
          # API key. Variables are only exported when present, since an empty one is an error.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::macOS build is not signed: set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and the APPLE_API_KEY_* secrets"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/app-v') && matrix.name == 'windows'
        name: Set up Windows signing
        id: windows-signing
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          # Azure Trusted Signing signs the app and both installers as Tauri builds them.
          if [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Windows build is not signed: set the AZURE_* secrets and variables"
            exit 0
          fi
          cargo install trusted-signing-cli --version 0.11.0 --locked
          {
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
          } >> "$GITHUB_ENV"
          config=$(printf '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e %s -a %s -c %s -d Synergy %%1"}}}' "$ENDPOINT" "$ACCOUNT" "$PROFILE")
          echo "args=--config '$config'" >> "$GITHUB_OUTPUT"
      - run: npx tauri build ${{ matrix.args }} ${{ steps.windows-signing.outputs.args }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: synergy-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            clients/app/src-tauri/target/**/release/bundle/nsis/*.exe
            clients/app/src-tauri/target/**/release/bundle/msi/*.msi
            clients/app/src-tauri/target/**/release/bundle/dmg/*.dmg
            clients/app/src-tauri/target/**/release/bundle/deb/*.deb
            clients/app/src-tauri/target/**/release/bundle/rpm/*.rpm
            clients/app/src-tauri/target/**/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Synergy ${TAG#app-v}" \
            --notes "Installers for Windows, macOS and Linux. Android and iOS builds go to Google Play and TestFlight from the mobile workflow." \
            $(find installers -type f)
