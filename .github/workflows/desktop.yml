# Checks the desktop app (clients/desktop) and builds its installers for Windows, macOS and
# Linux. Every run uploads the installers as workflow artifacts; pushing a desktop-v* tag also
# drafts a GitHub release with them. Builds are unsigned until signing secrets are added.
name: desktop

on:
  pull_request:
    paths: ["clients/desktop/**", "packages/config/apps.json", "packages/shell/assets/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["clients/desktop/**", "packages/config/apps.json", "packages/shell/assets/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
      - run: npm ci
      - run: npm run build:web
      - run: cargo fmt --check
        working-directory: clients/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: clients/desktop/src-tauri
      - run: cargo test
        working-directory: clients/desktop/src-tauri

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: synergy-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            clients/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            clients/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            clients/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            clients/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            clients/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Synergy desktop ${TAG#desktop-v}" \
            --notes "Installers for Windows, macOS and Linux. Builds are not code signed yet." \
            $(find installers -type f)
