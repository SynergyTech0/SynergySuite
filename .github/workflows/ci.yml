name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:packages
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: App unit tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test -w apps/sites
      - name: Compliance tests (chat, calendar, notes, forms)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test -w apps/chat -w apps/calendar -w apps/notes -w apps/forms
      - name: Apps boot on the shared packages
        env:
          DEV_USER_EMAIL: ci@example.com
        run: |
          for dir in apps/calendar apps/chat apps/forms apps/notes apps/sites addons/portal; do
            app=$(basename $dir)
            psql postgres://postgres:postgres@localhost:5432/postgres -qc "CREATE DATABASE $app"
            DATABASE_URL=postgres://postgres:postgres@localhost:5432/$app PORT=4000 node $dir/server/index.js &
            pid=$!
            for i in $(seq 1 40); do curl -sf localhost:4000/healthz >/dev/null && break; sleep 0.5; done
            curl -sf localhost:4000/api/me | grep -q ci@example.com || { echo "$app failed"; kill $pid; exit 1; }
            kill $pid; wait $pid || true
            echo "$app ok"
          done

