      - name: Stream tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stream_test
        # ffmpeg lets the upload test process a real video.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          psql postgres://postgres:postgres@localhost:5432/postgres -qc "CREATE DATABASE stream_test"
          npm test --workspace apps/stream
