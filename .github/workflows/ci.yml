          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sboards_test
        run: |
          npx drizzle-kit migrate
          npx vitest run

  books:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: books
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/books
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Typecheck the Books API
        run: npm run typecheck -w @synergy/books-api
      - name: Migrations match the schema
        working-directory: apps/books/api
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Service API unit tests
        working-directory: apps/books/api
        run: npx jest --preset ts-jest src/modules/svc
      - name: Build Books
        run: |
          npm run build -w @synergy/books-web
          npm run build -w @synergy/books-api
      - name: Books boots on suite sign-in
        working-directory: apps/books/api
        env:
          DEV_USER_EMAIL: ci@example.com
          REDIS_HOST: localhost
          BOOKS_SVC_TOKEN: ci-svc-token
        run: |
          node dist/main.js &
          pid=$!
          for i in $(seq 1 60); do curl -sf localhost:3055/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:3055/api/auth/me | grep -q ci@example.com || { kill $pid; exit 1; }
          curl -sf localhost:3055/ | grep -qi '<div id="root"' || { echo "web not served"; kill $pid; exit 1; }
          # The Portal's invoice feed refuses a missing token and answers with the right one.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3055/api/svc/invoices?email=a@example.com')" = 401 || { kill $pid; exit 1; }
          curl -sf -H "Authorization: Bearer $BOOKS_SVC_TOKEN" 'localhost:3055/api/svc/invoices?email=a@example.com' | grep -qx '\[\]' || { kill $pid; exit 1; }
          # Projects bills into Books as draft invoices through the same token.
          inv='{"customer":{"name":"CI client","email":"client@example.com"},"invoiceDate":"2026-10-16","reference":"PRJ-0001","currency":"USD","lines":[{"description":"Design","quantity":2,"unitPrice":150}]}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$inv" localhost:3055/api/svc/invoices)" = 401 || { kill $pid; exit 1; }
          curl -sf -H "Authorization: Bearer $BOOKS_SVC_TOKEN" -H 'Content-Type: application/json' -d "$inv" localhost:3055/api/svc/invoices | grep -q '"number"' || { kill $pid; exit 1; }
          # HR's payroll journal endpoint refuses a missing token and checks what it is sent.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' localhost:3055/api/svc/journals)" = 401 || { kill $pid; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $BOOKS_SVC_TOKEN" -H 'Content-Type: application/json' -d '{}' localhost:3055/api/svc/journals)" = 400 || { kill $pid; exit 1; }
          # Commerce's journal postings need the token and refuse an entry that doesn't balance.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3055/api/svc/postings)" = 401 || { kill $pid; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $BOOKS_SVC_TOKEN" -H 'Content-Type: application/json' \
            -d '{"reference":"ci-1","kind":"sale","date":"2026-01-01","lines":[{"account":"1010","debit":"5.00"},{"account":"4010","credit":"4.00"}]}' \
            localhost:3055/api/svc/postings)" = 400 || { kill $pid; exit 1; }
          kill $pid

  trust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trust
      TRUST_TENANT: example
    defaults:
      run:
        working-directory: apps/trust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build:packages
        working-directory: .
      - name: Typecheck Trust
        run: npx tsc --noEmit -p .
      - name: Migrations apply to a fresh database, and re-run cleanly
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs | grep -q "Already up to date"
          node scripts/seed.mjs --tenant example "Example Organisation"
      - name: Schema, append-only and RLS checks
        run: node scripts/verify.mjs
      - name: Build Trust
        run: npm run build
      - name: Collectors
        env:
          TRUST_MONITOR_PUBLIC: example.com
          TRUST_MONITOR_HOSTS: 127.0.0.1
          TRUST_MONITOR_SSH_HOSTS: localhost
        run: |
          node scripts/seed-monitors.mjs example
          # Exits non-zero when any monitor could not measure (expected for some here).
          node scripts/collect.mjs example || true
          node scripts/verify-collectors.mjs
      - name: API checks against the production server
        env:
          PROXY_SHARED_SECRET: ci-secret
        run: |
          npx next start -p 3670 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:3670/no-access && break; sleep 0.5; done
          node scripts/verify-api.mjs || { kill $pid; exit 1; }
          kill $pid
      - name: Access rules (suite sign-in, invitations, read-only seats, tenant isolation)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trust_access
          PROXY_SHARED_SECRET: ci-secret
          TRUST_BASE: http://127.0.0.1:3671
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -qc "CREATE DATABASE trust_access"
          node scripts/migrate.mjs
          node scripts/seed.mjs
          npx next start -p 3671 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:3671/no-access && break; sleep 0.5; done
          node scripts/verify-access.ts || { kill $pid; exit 1; }
          kill $pid
      - name: Contrast in both themes
        run: node scripts/verify-contrast.mjs
      - name: Trust boots on suite sign-in (DEV_USER_EMAIL)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trust_dev
          DEV_USER_EMAIL: ci@example.com
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -qc "CREATE DATABASE trust_dev"
          node scripts/migrate.mjs
          node scripts/seed.mjs
          # DEV_USER_EMAIL only applies outside production, so this runs the dev server.
          npx next dev -p 3672 &
          pid=$!
          for i in $(seq 1 120); do curl -s -o /dev/null localhost:3672/api/me && break; sleep 1; done
          curl -sf localhost:3672/api/me | tee /dev/stderr | grep -q '"email":"ci@example.com"' || { kill $pid; exit 1; }
          curl -sf localhost:3672/api/me | grep -q '"role":"owner"' || { kill $pid; exit 1; }
          curl -sf localhost:3672/ | grep -q 'My Company' || { kill $pid; exit 1; }
          kill $pid
