# Synergy Suite: one-command self-host for the apps that use the shared packages.
#   deploy/quickstart.sh                 # try it on your machine (writes deploy/.env for you)
# or, on a server:
#   cp deploy/.env.example deploy/.env   # fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# More apps join this file as they move onto the shared packages.

# Each app's image is published to the GitHub Container Registry by .github/workflows/images.yml
# (see deploy/README.md); deploy/quickstart.sh pulls them and builds here only what it can't pull.
# SYNERGY_REGISTRY and SYNERGY_IMAGE_TAG pick another registry or a commit's images.
x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-express: &express
  <<: *app
  build: &express-build
    context: ..
    dockerfile: deploy/express-app.Dockerfile

x-next: &next
  <<: *app
  build: &next-build
    context: ..
    dockerfile: deploy/next-app.Dockerfile

x-app-env: &app-env
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET}
  SUITE_DOMAIN: ${SUITE_DOMAIN:?set SUITE_DOMAIN}
  # Bring your own AI model: one setting for every app's AI features (see .env.example).
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
  # Public demo instance (see .env.example): mail and meet then send nothing outside the suite.
  DEMO_MODE: ${DEMO_MODE:-}
  # eDiscovery and legal hold: apps answer the Admin center's searches and ask it who is on hold.
  # Without COMPLIANCE_TOKEN there is no Admin center link: no holds, no retention, no searches.
  COMPLIANCE_TOKEN: ${COMPLIANCE_TOKEN:-}
  ADMIN_INTERNAL_URL: ${COMPLIANCE_TOKEN:+http://admin:3700}
  # Groups (teams, lists, shared mailboxes): apps ask it who is in what through @synergy/groups.
  GROUPS_INTERNAL_URL: http://groups:3830

# Demo mode's shared login, read by auth (shown on the sign-in page) and the demo service.
x-demo-env: &demo-env
  DEMO_MODE: ${DEMO_MODE:-}
  DEMO_EMAIL: ${DEMO_EMAIL:-demo@${MAIL_DOMAIN:-${SUITE_DOMAIN}}}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-SynergyDemo1}
  DEMO_RESET_MINUTES: ${DEMO_RESET_MINUTES:-60}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Identity provider (Entra ID equivalent). Public: it is the login page.
  auth:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-auth:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build: ../apps/auth
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
      ISSUER_URL: https://auth.${SUITE_DOMAIN}
      SA_RP_ID: auth.${SUITE_DOMAIN}
      SA_ENCRYPTION_KEY: ${SA_ENCRYPTION_KEY:?set SA_ENCRYPTION_KEY}
      SUITE_DOMAIN: ${SUITE_DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      # Calendar and Contacts check app passwords here with it (phone sync).
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET}
      <<: *demo-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3500/api/oidc/jwks').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Runs once per `up`, then exits: creates the first admin if there is none and registers
  # (or updates) the gateway's OIDC client from OIDC_CLIENT_ID/OIDC_CLIENT_SECRET. Idempotent.
  auth-init:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-auth:${SYNERGY_IMAGE_TAG:-latest}
    build: ../apps/auth
    command: ["node", "scripts/bootstrap.mjs"]
    restart: "no"
    depends_on:
      auth: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
      AUTH_INTERNAL_URL: http://auth:3500
      SUITE_DOMAIN: ${SUITE_DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      # Only used when the admin is created. Empty: a random one is printed in this service's log.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      GATEWAY_REDIRECT_URI: https://sso.${SUITE_DOMAIN}/oauth2/callback

  # Demo mode: seeds a fictional company (deploy/demo/content.mjs) into calendar, chat, notes,
  # planner and mail, and puts everything back every DEMO_RESET_MINUTES (deploy/demo/reset.mjs).
  # Uses the auth image for its Postgres driver. With DEMO_MODE unset it exits at once.
  demo:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-auth:${SYNERGY_IMAGE_TAG:-latest}
    build: ../apps/auth
    command: ["node", "demo/reset.mjs"]
    restart: on-failure
    depends_on:
      auth-init: { condition: service_completed_successfully }
    volumes:
      - ./demo:/app/demo:ro
    environment:
      <<: *demo-env
      SUITE_DOMAIN: ${SUITE_DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      PG_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432
      MAIL_IMAP_HOST: stalwart
      MAIL_IMAP_PORT: "993"
      MAIL_SUITE_TLS_INSECURE: ${MAIL_SUITE_TLS_INSECURE:-true}
      MAIL_MASTER_USER: webmail@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD:-}
      MAIL_ADMIN_URL: http://stalwart:8080
      MAIL_ADMIN_USER: postmaster@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}

  # Sign-in gateway: one OIDC client for the whole suite, session cookie on .SUITE_DOMAIN.
  # The browser signs in at https://auth.SUITE_DOMAIN; the gateway's own calls to auth (code
  # redemption, signing keys) stay on the compose network, so it needs neither DNS for the
  # suite domain nor to trust Caddy's certificate. ID tokens are still checked against the
  # public issuer.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${SUITE_DOMAIN}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://auth.${SUITE_DOMAIN}/api/oidc/authorize
      OAUTH2_PROXY_REDEEM_URL: http://auth:3500/api/oidc/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://auth:3500/api/oidc/jwks
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${SUITE_DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${SUITE_DOMAIN}
      OAUTH2_PROXY_REDIRECT_URL: https://sso.${SUITE_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_REFRESH: "1h"
      OAUTH2_PROXY_COOKIE_EXPIRE: "168h"
      OAUTH2_PROXY_UPSTREAMS: static://202
    depends_on:
      auth: { condition: service_healthy }
      auth-init: { condition: service_completed_successfully }

  # The only service with published ports. TLS certificates are automatic: Let's Encrypt by
  # default, or Caddy's own local CA when CADDY_GLOBAL_OPTIONS=local_certs (deploy/quickstart.sh).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["${HTTP_PUBLISH:-80}:80", "${HTTPS_PUBLISH:-443}:443"]
    environment:
      SUITE_DOMAIN: ${SUITE_DOMAIN}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET}
      LIVEKIT_UPSTREAM: ${LIVEKIT_UPSTREAM:-livekit:7880}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [oauth2-proxy]
    # flow: to reach the flow designer (flow-engine), which is on no other network.
    networks: [default, flow]

  calendar:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-calendar:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: calendar } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/calendar
      CAL_SVC_TOKEN: ${CAL_SVC_TOKEN:-}
      AUTH_INTERNAL_URL: http://auth:3500
      # Draft with Copilot for event notes: the AI_* model, or these to give Calendar its own.
      CALENDAR_AI_PROVIDER: ${CALENDAR_AI_PROVIDER:-}
      CALENDAR_AI_BASE_URL: ${CALENDAR_AI_BASE_URL:-}
      CALENDAR_AI_API_KEY: ${CALENDAR_AI_API_KEY:-}
      CALENDAR_AI_MODEL: ${CALENDAR_AI_MODEL:-}

  # Microsoft Bookings equivalent: public booking pages, services, staff availability from
  # Calendar, Meet links, and confirmations and reminders sent from each page's suite mailbox.
  bookings:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-bookings:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: bookings } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/bookings
      # Free/busy and appointment events on staff calendars. Without it, Bookings only knows its own appointments.
      CAL_SVC_TOKEN: ${CAL_SVC_TOKEN:-}
      CALENDAR_INTERNAL_URL: http://calendar:3130
      CONTACTS_INTERNAL_URL: http://contacts:3190
      # Sends as each page's mailbox through Stalwart, the way Mail does. BOOKINGS_SMTP_* sends
      # everything through one outside mailbox instead.
      MAIL_SMTP_HOST: stalwart
      MAIL_SMTP_PORT: "465"
      MAIL_SUITE_TLS_INSECURE: ${MAIL_SUITE_TLS_INSECURE:-true}
      MAIL_MASTER_USER: webmail@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD:-}
      MAIL_ADMIN_URL: http://stalwart:8080
      MAIL_ADMIN_USER: postmaster@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}
      BOOKINGS_SMTP_HOST: ${BOOKINGS_SMTP_HOST:-}
      BOOKINGS_SMTP_PORT: ${BOOKINGS_SMTP_PORT:-}
      BOOKINGS_SMTP_USER: ${BOOKINGS_SMTP_USER:-}
      BOOKINGS_SMTP_PASSWORD: ${BOOKINGS_SMTP_PASSWORD:-}
      BOOKINGS_SMTP_FROM: ${BOOKINGS_SMTP_FROM:-}

  chat:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-chat:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: chat } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chat

  forms:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-forms:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: forms } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/forms

  notes:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-notes:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: notes } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/notes

  notes-collab:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-notes:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: notes } }
    command: ["node", "server/collab.mjs"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/notes
      COLLAB_PORT: "3136"
      COLLAB_ADDRESS: 0.0.0.0

  sites:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-sites:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: sites } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/sites
      # The Booking block embeds pages from Bookings.
      SITES_BOOKING_URL: ${SITES_BOOKING_URL:-https://bookings.${SUITE_DOMAIN}}
      SITES_LIVECHAT_URL: ${SITES_LIVECHAT_URL:-}
      # Each site's document library is a Drive library whose people Sites keeps (DRIVE_SVC_TOKEN on both).
      SITES_DRIVE_URL: http://drive:3180
      DRIVE_SVC_TOKEN: ${DRIVE_SVC_TOKEN:-}

  # ---- add-ons ----
  portal:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-portal:${SYNERGY_IMAGE_TAG:-latest}
    <<: *express
    build: { <<: *express-build, args: { APP: portal, APP_DIR: addons/portal } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/portal
      ALLOWED_EMAILS: ${PORTAL_ALLOWED_EMAILS:-}
      # Clients see their invoices from Books and their tickets from Desk.
      INVOICE_SVC_URL: ${INVOICE_SVC_URL:-http://books:3055}
      INVOICE_SVC_TOKEN: ${INVOICE_SVC_TOKEN:-${BOOKS_SVC_TOKEN:-}}
      DESK_SVC_URL: ${DESK_SVC_URL:-http://desk:3105}
      DESK_SVC_TOKEN: ${DESK_SVC_TOKEN:-${DESK_API_TOKEN:-}}

  # E-signatures (DocuSign equivalent): templates, multi-party signing, audit trail. People sign in
  # with their suite account; signers outside the organization sign from emailed links without one.
  sign:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-sign:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build:
      context: ..
      dockerfile: deploy/sign.Dockerfile
    environment:
      <<: *app-env
      # The database is created on first start if postgres-init.sql didn't make it.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/sign
      SIGN_PUBLIC_URL: https://sign.${SUITE_DOMAIN}
      SIGN_ADMIN_EMAILS: ${SIGN_ADMIN_EMAILS:-${SEED_ADMIN_EMAIL:-}}
      # Signs the short-lived links a signer's PDF viewer loads the document through.
      SIGN_LINK_SECRET: ${SIGN_LINK_SECRET:-${PROXY_SHARED_SECRET}}
      # Documents on the volume below; STORAGE_MODE=s3 with AWS_* (or any S3-compatible store) instead.
      STORAGE_MODE: ${SIGN_STORAGE_MODE:-local}
      ENABLE_S3_BACKUP: ${SIGN_S3_BACKUP:-false}
      LOCAL_STORAGE_PATH: /data/files
      AWS_REGION: ${SIGN_S3_REGION:-}
      AWS_ENDPOINT_URL: ${SIGN_S3_ENDPOINT:-}
      AWS_BUCKET_NAME: ${SIGN_S3_BUCKET:-}
      AWS_FOLDER_PREFIX: ${SIGN_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${SIGN_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${SIGN_S3_SECRET_ACCESS_KEY:-}
      # Signing requests go out from the suite mailbox sign@MAIL_DOMAIN through Stalwart, as
      # Bookings does. SIGN_SMTP_* sends through one outside mailbox instead.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_SMTP_HOST: stalwart
      MAIL_SMTP_PORT: "465"
      MAIL_SUITE_TLS_INSECURE: ${MAIL_SUITE_TLS_INSECURE:-true}
      MAIL_MASTER_USER: webmail@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD:-}
      MAIL_ADMIN_URL: http://stalwart:8080
      MAIL_ADMIN_USER: postmaster@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}
      SIGN_MAIL_FROM: ${SIGN_MAIL_FROM:-}
      SIGN_SMTP_HOST: ${SIGN_SMTP_HOST:-}
      SIGN_SMTP_PORT: ${SIGN_SMTP_PORT:-}
      SIGN_SMTP_USER: ${SIGN_SMTP_USER:-}
      SIGN_SMTP_PASSWORD: ${SIGN_SMTP_PASSWORD:-}
      SIGN_SMTP_FROM: ${SIGN_SMTP_FROM:-}
      SIGN_DEV_MAIL_DIR: /data/files/.unsent-mail
      # Its own AI model for field detection, if it should differ from the suite's (needs one that reads images).
      SIGN_AI_PROVIDER: ${SIGN_AI_PROVIDER:-}
      SIGN_AI_BASE_URL: ${SIGN_AI_BASE_URL:-}
      SIGN_AI_API_KEY: ${SIGN_AI_API_KEY:-}
      SIGN_AI_MODEL: ${SIGN_AI_MODEL:-}
    volumes:
      - sign-files:/data/files

  # Email marketing (Dynamics Marketing / Mailchimp equivalent): audiences from CRM, Contacts,
  # spreadsheets and a signup form; campaigns, automations, open and click tracking, one-click
  # unsubscribe and bounce handling. Sends as its From mailbox through Stalwart, the way
  # Bookings does; CAMPAIGNS_SMTP_* sends through an outside relay instead.
  campaigns:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-campaigns:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: campaigns, APP_DIR: addons/campaigns } }
    depends_on:
      postgres: { condition: service_healthy }
      campaigns-db: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/campaigns
      # Imports and keeps lists in sync from CRM contacts and leads and Contacts groups, as the person.
      CRM_INTERNAL_URL: http://crm:3095
      CONTACTS_INTERNAL_URL: http://contacts:3190
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_SMTP_HOST: stalwart
      MAIL_SMTP_PORT: "465"
      # Bounce and spam reports come back to the From mailbox; Campaigns reads them over IMAP.
      MAIL_IMAP_HOST: stalwart
      MAIL_IMAP_PORT: "993"
      MAIL_SUITE_TLS_INSECURE: ${MAIL_SUITE_TLS_INSECURE:-true}
      MAIL_MASTER_USER: webmail@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD:-}
      MAIL_ADMIN_URL: http://stalwart:8080
      MAIL_ADMIN_USER: postmaster@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}
      CAMPAIGNS_FROM_EMAIL: ${CAMPAIGNS_FROM_EMAIL:-}
      CAMPAIGNS_FROM_NAME: ${CAMPAIGNS_FROM_NAME:-}
      CAMPAIGNS_ORG_NAME: ${CAMPAIGNS_ORG_NAME:-}
      CAMPAIGNS_POSTAL_ADDRESS: ${CAMPAIGNS_POSTAL_ADDRESS:-}
      CAMPAIGNS_PER_MINUTE: ${CAMPAIGNS_PER_MINUTE:-}
      CAMPAIGNS_SMTP_HOST: ${CAMPAIGNS_SMTP_HOST:-}
      CAMPAIGNS_SMTP_PORT: ${CAMPAIGNS_SMTP_PORT:-}
      CAMPAIGNS_SMTP_USER: ${CAMPAIGNS_SMTP_USER:-}
      CAMPAIGNS_SMTP_PASSWORD: ${CAMPAIGNS_SMTP_PASSWORD:-}
      CAMPAIGNS_BOUNCE_IMAP_HOST: ${CAMPAIGNS_BOUNCE_IMAP_HOST:-}
      CAMPAIGNS_BOUNCE_IMAP_PORT: ${CAMPAIGNS_BOUNCE_IMAP_PORT:-}
      CAMPAIGNS_BOUNCE_IMAP_USER: ${CAMPAIGNS_BOUNCE_IMAP_USER:-}
      CAMPAIGNS_BOUNCE_IMAP_PASSWORD: ${CAMPAIGNS_BOUNCE_IMAP_PASSWORD:-}

  # Makes the campaigns database on installs that started before Campaigns joined. Runs once per `up`.
  campaigns-db:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'campaigns'\" | grep -q 1 || psql -c 'CREATE DATABASE campaigns'"]

  # Meet's and Phone's media server: LiveKit (Apache-2.0, headless; people only ever see Meet and
  # Phone). Browsers reach its signalling through the gateway (wss://meet.SUITE_DOMAIN/rtc, see
  # LIVEKIT_UPSTREAM in the Caddyfile) and send media straight to it:
  #   7881/tcp  media over TCP, for networks that block UDP (LIVEKIT_TCP_PUBLISH)
  #   7882/udp  media over UDP, every call on this one port (LIVEKIT_UDP_PUBLISH)
  # It tells browsers to send media to LIVEKIT_NODE_IP, or with that empty, to the public IP it
  # finds over STUN. Keys: LIVEKIT_API_KEY / LIVEKIT_API_SECRET (quickstart generates them).
  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    ports:
      - "${LIVEKIT_TCP_PUBLISH:-7881}:7881/tcp"
      - "${LIVEKIT_UDP_PUBLISH:-7882}:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      NODE_IP: ${LIVEKIT_NODE_IP:-}
      # Tells Phone who joined and left each call. With the sip profile, LIVEKIT_REDIS_ADDRESS=sip-valkey:6379
      # links it to the SIP service.
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        webhook:
          api_key: "${LIVEKIT_API_KEY:-}"
          urls: ["${LIVEKIT_WEBHOOK_URL:-http://phone:3440/api/livekit/webhook}"]
        redis:
          address: "${LIVEKIT_REDIS_ADDRESS:-}"

  # Phone's link to real phone numbers (optional): LiveKit's SIP service (Apache-2.0, headless) and
  # the Valkey (BSD) store it shares with the media server. Start them with the sip profile:
  #   COMPOSE_PROFILES=sip and LIVEKIT_REDIS_ADDRESS=sip-valkey:6379 in .env, then up -d
  #   5060/udp+tcp     SIP signalling   -> open to your SIP trunk provider or PBX (SIP_PUBLISH)
  #   10000-10099/udp  call audio (RTP) -> open to the same (100 ports: about 100 calls at once)
  sip-valkey:
    image: valkey/valkey:8.1-alpine
    profiles: [sip]
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1"]
    volumes:
      - sip-valkey-data:/data

  sip:
    image: livekit/sip:v1.19
    profiles: [sip]
    restart: unless-stopped
    depends_on: [sip-valkey, livekit]
    ports:
      - "${SIP_PUBLISH:-5060}:5060/udp"
      - "${SIP_PUBLISH:-5060}:5060/tcp"
      - "10000-10099:10000-10099/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY:-}"
        api_secret: "${LIVEKIT_API_SECRET:-}"
        ws_url: ws://livekit:7880
        redis:
          address: sip-valkey:6379
        sip_port: 5060
        rtp_port: 10000-10099
        use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        nat_1_to_1_ip: "${LIVEKIT_NODE_IP:-}"
        log_level: info

  # Word, Excel and PowerPoint equivalents, plus their real-time co-editing server.
  meet:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-meet:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build:
      <<: *next-build
      args:
        APP: meet
        NEXT_PUBLIC_LIVEKIT_URL: wss://meet.${SUITE_DOMAIN}
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/meet
      NEXT_PUBLIC_LIVEKIT_URL: wss://meet.${SUITE_DOMAIN}
      # The media server (the livekit service above, or your own: LIVEKIT_UPSTREAM) and its keys.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_API_URL: http://${LIVEKIT_UPSTREAM:-livekit:7880}
      TURN_HOST: ${TURN_HOST:-}
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:-}
      # Hosts call phone numbers into meetings through Phone.
      PHONE_SVC_TOKEN: ${PHONE_SVC_TOKEN:-}

  # Teams Phone equivalent: calls between colleagues and to real numbers, voicemail, call history.
  # Calls run on Meet's LiveKit media server (same keys); real numbers come in and go out through
  # LiveKit's SIP service (the sip profile above) and the SIP trunks set up in Phone admin.
  phone:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-phone:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: phone, APT_PACKAGES: espeak-ng } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/phone
      NEXT_PUBLIC_LIVEKIT_URL: wss://meet.${SUITE_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_API_URL: http://${LIVEKIT_UPSTREAM:-livekit:7880}
      TURN_HOST: ${TURN_HOST:-}
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:-}
      PHONE_ADMIN_EMAILS: ${PHONE_ADMIN_EMAILS:-${ADMIN_EMAILS:-}}
      PHONE_COUNTRY_CODE: ${PHONE_COUNTRY_CODE:-1}
      PHONE_SIP_HOST: ${PHONE_SIP_HOST:-sip.${SUITE_DOMAIN}}
      PHONE_SVC_TOKEN: ${PHONE_SVC_TOKEN:-}
      PHONE_AI_SPEECH_MODEL: ${PHONE_AI_SPEECH_MODEL:-${AI_SPEECH_MODEL:-}}
      CONTACTS_INTERNAL_URL: http://contacts:3190

  office:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-office:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build:
      <<: *next-build
      args:
        APP: office
        NEXT_PUBLIC_COLLAB_URL: wss://office.${SUITE_DOMAIN}/collab
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/office
      # Read at run time too, so an image built without the build argument (the published
      # images are built once for every domain) still finds the collaboration server.
      NEXT_PUBLIC_COLLAB_URL: wss://office.${SUITE_DOMAIN}/collab

  office-collab:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-office:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build:
      <<: *next-build
      args:
        APP: office
        NEXT_PUBLIC_COLLAB_URL: wss://office.${SUITE_DOMAIN}/collab
    command: ["node", "server/collab.mjs"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/office
      COLLAB_ADDRESS: 0.0.0.0
      COLLAB_PORT: "3071"

  # Microsoft Loop equivalent: shared workspaces and pages with live components (task lists,
  # polls, tables, trackers, Q&A) that stay in sync wherever they're shared, Chat included.
  loop:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-loop:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: loop } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/loop

  # Loop's live collaboration server (Hocuspocus), reached through the gateway at /collab.
  loop-collab:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-loop:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: loop } }
    command: ["node", "server/collab.mjs"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/loop
      COLLAB_ADDRESS: 0.0.0.0
      COLLAB_PORT: "3771"

  # Books (Dynamics 365 Business Central equivalent): API and web app in one container.
  books:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-books:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build:
      context: ..
      dockerfile: deploy/books.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/books
      REDIS_HOST: redis
      # 64 hex characters; encrypts stored bank account numbers and filing PINs.
      ENCRYPTION_KEY: ${BOOKS_ENCRYPTION_KEY:-}
      BOOKS_COMPANY_NAME: ${BOOKS_COMPANY_NAME:-}
      EMAIL_FROM: ${BOOKS_EMAIL_FROM:-}
      # Lets the Portal add-on list a client's invoices (/api/svc/invoices) and Ops send fixed
      # assets (/api/svc/fixed-assets). Empty turns these off.
      BOOKS_SVC_TOKEN: ${BOOKS_SVC_TOKEN:-}

  # Job queue for Books (background tax and bank classification).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  planner:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-planner:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: planner } }
    # Apply pending schema migrations, then serve.
    command: ["sh", "-c", "npx drizzle-kit migrate && npm run start"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/planner
      ATTACHMENT_DIR: /data/attachments
      MIND_TOKEN: ${MIND_TOKEN:-}
    volumes:
      - planner-attachments:/data/attachments

  # Compliance readiness (Purview Compliance Manager equivalent): SOC 2, ISO 27001, HIPAA, GDPR.
  # Applies its migrations and the framework catalog on every start, then serves.
  trust:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-trust:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: trust } }
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed.mjs && npm run start"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/trust
      # Names the organisation created for the first user who opens Trust (default My Company).
      TRUST_COMPANY_NAME: ${TRUST_COMPANY_NAME:-}
      # Endpoint compliance and threat evidence from Devices.
      DEVICES_INTERNAL_URL: http://devices:3810
      DEVICES_SVC_TOKEN: ${DEVICES_SVC_TOKEN:-}

  # Databases and lists (Access and Lists equivalent). Makes its catalog on first use; each
  # database it holds is a schema of its own in this Postgres database.
  base:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-base:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: base } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/base

  # Low-code apps (Power Apps equivalent): screens, galleries and forms with formulas, on Base
  # tables. Reads and writes Base as the person using the app, so Base's sharing rules apply.
  builder:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-builder:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: builder } }
    depends_on:
      postgres: { condition: service_healthy }
      builder-db: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/builder

  # Makes the builder database on installs that started before Builder. Runs once per `up`.
  builder-db:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'builder'\" | grep -q 1 || psql -c 'CREATE DATABASE builder'"]

  # Image editing (Photoshop/Designer equivalent): the PhotoCraft engine compiled to WebAssembly.
  photo:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-photo:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build:
      context: ..
      dockerfile: deploy/photo.Dockerfile
    environment:
      <<: *app-env
      PHOTO_DIR: /data/photos
    volumes:
      - photo-files:/data/photos

  # Microsoft Stream and Clipchamp equivalent: the organization's video library (upload, record,
  # captions, chapters, comments, sharing and links) and a video editor, the FilmCraft engine
  # compiled to WebAssembly. Videos live in the stream-files volume; back it up with Postgres.
  stream:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-stream:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build:
      context: ..
      dockerfile: deploy/stream.Dockerfile
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/stream
      STREAM_DIR: /data/stream
      STREAM_MAX_UPLOAD_MB: ${STREAM_MAX_UPLOAD_MB:-}
      STREAM_JOBS: ${STREAM_JOBS:-}
      AI_SPEECH_MODEL: ${AI_SPEECH_MODEL:-}
    volumes:
      - stream-files:/data/stream

  # 2D drafting (AutoCAD equivalent): the CADCraft engine compiled to WebAssembly, with DWG and DXF.
  cad:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-cad:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build:
      context: ..
      dockerfile: deploy/cad.Dockerfile
    environment:
      <<: *app-env
      CAD_DIR: /data/drawings
    volumes:
      - cad-files:/data/drawings

  # Visio equivalent: flowcharts, org charts, network and software diagrams in draw.io's editor,
  # with Visio (.vsdx) import, sharing and version history. Its AI drafting uses the suite's AI
  # setting unless the DIAGRAMS_AI_* settings point it at another model.
  diagrams:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-diagrams:${SYNERGY_IMAGE_TAG:-latest}
    <<: *app
    build:
      context: ..
      dockerfile: deploy/diagrams.Dockerfile
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/diagrams
      DIAGRAMS_MAX_MB: ${DIAGRAMS_MAX_MB:-}
      DIAGRAMS_VERSIONS: ${DIAGRAMS_VERSIONS:-}
      DIAGRAMS_AI_PROVIDER: ${DIAGRAMS_AI_PROVIDER:-}
      DIAGRAMS_AI_BASE_URL: ${DIAGRAMS_AI_BASE_URL:-}
      DIAGRAMS_AI_API_KEY: ${DIAGRAMS_AI_API_KEY:-}
      DIAGRAMS_AI_MODEL: ${DIAGRAMS_AI_MODEL:-}

  # OneDrive equivalent: files, folders, sharing, view links, shared libraries and version history.
  # File contents live in the drive-files volume; back it up together with Postgres.
  drive:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-drive:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: drive } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/drive
      DRIVE_DIR: /data/drive
      DRIVE_QUOTA_MB: ${DRIVE_QUOTA_MB:-}
      DRIVE_MAX_FILE_MB: ${DRIVE_MAX_FILE_MB:-}
      DRIVE_TRASH_DAYS: ${DRIVE_TRASH_DAYS:-}
      DRIVE_VERSIONS: ${DRIVE_VERSIONS:-}
      # Sites makes and staffs its sites' document libraries through /api/svc/managed-libraries.
      DRIVE_SVC_TOKEN: ${DRIVE_SVC_TOKEN:-}
    volumes:
      - drive-files:/data/drive

  # Outlook People equivalent: each person's address book and the organization directory.
  # The directory lists every suite account when DIRECTORY_SCIM_TOKEN holds a SCIM token from
  # the auth admin console; without one it lists the people who have opened Contacts.
  contacts:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-contacts:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: contacts } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/contacts
      AUTH_INTERNAL_URL: http://auth:3500
      DIRECTORY_SCIM_TOKEN: ${DIRECTORY_SCIM_TOKEN:-}

  # Microsoft To Do equivalent: lists, My Day, due dates, reminders, repeating and shared tasks.
  todo:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-todo:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: todo } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/todo

  # Intune and Defender for Endpoint equivalent: the osquery agent on each computer reports
  # inventory, compliance and threat detections here. DEVICES_PUBLIC_HOST is the name agents reach
  # (default devices.SUITE_DOMAIN); DEVICES_TLS_CA (PEM) is installed on them when the server's
  # certificate comes from a private CA. DEVICES_SVC_TOKEN gives Trust the posture feed. Alert
  # explanations use the suite's AI_* model (DEVICES_AI_* to give Devices its own).
  devices:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-devices:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: devices } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/devices
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEVICES_ADMIN_EMAILS: ${DEVICES_ADMIN_EMAILS:-}
      DEVICES_SVC_TOKEN: ${DEVICES_SVC_TOKEN:-}
      DEVICES_PUBLIC_HOST: ${DEVICES_PUBLIC_HOST:-}
      DEVICES_TLS_CA: ${DEVICES_TLS_CA:-}
      DEVICES_OSV_URL: ${DEVICES_OSV_URL:-}
      DEVICES_AI_PROVIDER: ${DEVICES_AI_PROVIDER:-}
      DEVICES_AI_BASE_URL: ${DEVICES_AI_BASE_URL:-}
      DEVICES_AI_API_KEY: ${DEVICES_AI_API_KEY:-}
      DEVICES_AI_MODEL: ${DEVICES_AI_MODEL:-}
      DEVICES_MDM_URL: http://devices-mdm:9000
      DEVICES_MDM_API_KEY: ${DEVICES_MDM_API_KEY:-}
      DEVICES_MDM_WEBHOOK_KEY: ${DEVICES_MDM_WEBHOOK_KEY:-}
      DEVICES_SCEP_CHALLENGE: ${DEVICES_SCEP_CHALLENGE:-}
      DEVICES_ORG_NAME: ${DEVICES_ORG_NAME:-}
      DEVICES_ANDROID_SERVICE_ACCOUNT: ${DEVICES_ANDROID_SERVICE_ACCOUNT:-}

  # Apple device management for Devices: NanoMDM speaks the MDM protocol to iPhones, iPads and
  # Macs, and the SCEP server issues their identity certificates. Both are MIT (MicroMDM project).
  # They stay idle until DEVICES_MDM_API_KEY, DEVICES_MDM_WEBHOOK_KEY and DEVICES_SCEP_CHALLENGE
  # are set. The proxy exposes only the device endpoints, never NanoMDM's API.
  devices-scep:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-apple-mdm:${SYNERGY_IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: apple-mdm.Dockerfile
    command: ["scep"]
    environment:
      DEVICES_SCEP_CHALLENGE: ${DEVICES_SCEP_CHALLENGE:-}
      DEVICES_ORG_NAME: ${DEVICES_ORG_NAME:-}
    volumes:
      - devices-scep:/data

  devices-mdm:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-apple-mdm:${SYNERGY_IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: apple-mdm.Dockerfile
    command: ["mdm"]
    environment:
      DEVICES_MDM_API_KEY: ${DEVICES_MDM_API_KEY:-}
      DEVICES_MDM_WEBHOOK_KEY: ${DEVICES_MDM_WEBHOOK_KEY:-}
    volumes:
      - devices-mdm:/data
      - devices-scep:/scep-depot:ro
    depends_on: [devices-scep]

  # Viva Engage and Viva Connections equivalent: the company home page (news, quick links, sites,
  # apps), a social feed, communities, praise, polls and Q&A. It reads Sites and Chat as the viewer.
  # ENGAGE_AI_* give its summaries a model of their own instead of the suite's AI_* one.
  engage:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-engage:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: engage } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/engage
      ENGAGE_ADMIN_EMAILS: ${ENGAGE_ADMIN_EMAILS:-${ADMIN_EMAILS:-}}
      ENGAGE_COMPANY_NAME: ${ENGAGE_COMPANY_NAME:-}
      ENGAGE_AI_PROVIDER: ${ENGAGE_AI_PROVIDER:-}
      ENGAGE_AI_BASE_URL: ${ENGAGE_AI_BASE_URL:-}
      ENGAGE_AI_API_KEY: ${ENGAGE_AI_API_KEY:-}
      ENGAGE_AI_MODEL: ${ENGAGE_AI_MODEL:-}

  # Microsoft 365 Groups and Teams equivalent: teams that bring their people a Chat workspace with
  # channels, a Drive library, a group calendar and a shared mailbox; distribution lists; shared
  # mailboxes; security groups other apps grant access to. Groups pushes membership to Chat, Drive,
  # Calendar (CAL_SVC_TOKEN) and Mail, and answers the other apps' "who is in what" (@synergy/groups).
  groups:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-groups:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: groups } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/groups
      GROUPS_MAIL_DOMAIN: ${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      GROUPS_ADMIN_EMAILS: ${GROUPS_ADMIN_EMAILS:-}
      GROUPS_CREATE: ${GROUPS_CREATE:-}
      CAL_SVC_TOKEN: ${CAL_SVC_TOKEN:-}

  # Microsoft Project and Dynamics 365 Project Operations equivalent: plans with a Gantt chart,
  # teams and rates, weekly timesheets, expenses with receipts, approvals, and billing that
  # lands in Books as draft invoices (needs BOOKS_SVC_TOKEN on both). Imports Planner boards.
  projects:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-projects:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: projects } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/projects
      BOOKS_SVC_TOKEN: ${BOOKS_SVC_TOKEN:-}
      BOOKS_INTERNAL_URL: http://books:3055
      PLANNER_INTERNAL_URL: http://planner:3600
      PROJECTS_AI_PROVIDER: ${PROJECTS_AI_PROVIDER:-}
      PROJECTS_AI_BASE_URL: ${PROJECTS_AI_BASE_URL:-}
      PROJECTS_AI_API_KEY: ${PROJECTS_AI_API_KEY:-}
      PROJECTS_AI_MODEL: ${PROJECTS_AI_MODEL:-}

  # Dynamics 365 Field Service equivalent: work orders for jobs at customer sites, a schedule
  # board for dispatchers, a phone view for technicians with sign-off, and customers' equipment.
  # Each link is on when its token is set: parts come off Commerce stock (COMMERCE_SVC_TOKEN),
  # finished jobs bill into Books as draft invoices (BOOKS_SVC_TOKEN), Desk cases become work
  # orders and hear back (DESK_API_TOKEN), and equipment imports from Ops (OPS_API_TOKEN).
  field:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-field:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: field } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/field
      COMMERCE_SVC_TOKEN: ${COMMERCE_SVC_TOKEN:-}
      BOOKS_SVC_TOKEN: ${BOOKS_SVC_TOKEN:-}
      DESK_API_TOKEN: ${DESK_API_TOKEN:-}
      OPS_API_TOKEN: ${OPS_API_TOKEN:-}
      FIELD_PARTS_ACCOUNT: ${FIELD_PARTS_ACCOUNT:-}
      FIELD_AI_PROVIDER: ${FIELD_AI_PROVIDER:-}
      FIELD_AI_BASE_URL: ${FIELD_AI_BASE_URL:-}
      FIELD_AI_API_KEY: ${FIELD_AI_API_KEY:-}
      FIELD_AI_MODEL: ${FIELD_AI_MODEL:-}

  # Contract lifecycle (Dynamics 365 and SharePoint Syntex contract management equivalent): templates and
  # a clause library, drafting with versions and redlines, ordered approvals, signatures through Sign,
  # renewals and notice deadlines, obligations, and AI review on the suite's model.
  contracts:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-contracts:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: contracts } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/contracts
      CONTRACTS_ADMIN_EMAILS: ${CONTRACTS_ADMIN_EMAILS:-${ADMIN_EMAILS:-}}
      CONTRACTS_SIGN_URL: ${CONTRACTS_SIGN_URL:-}
      CONTRACTS_SIGN_TOKEN: ${CONTRACTS_SIGN_TOKEN:-}
      CONTRACTS_AI_PROVIDER: ${CONTRACTS_AI_PROVIDER:-}
      CONTRACTS_AI_BASE_URL: ${CONTRACTS_AI_BASE_URL:-}
      CONTRACTS_AI_API_KEY: ${CONTRACTS_AI_API_KEY:-}
      CONTRACTS_AI_MODEL: ${CONTRACTS_AI_MODEL:-}

  # Dynamics 365 Human Resources and payroll equivalent: people, org chart, time off, onboarding,
  # pay runs and pay stubs. It took over the People add-on's database, so its records carry over.
  hr:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-hr:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: hr } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/people
      HR_ADMIN_EMAILS: ${HR_ADMIN_EMAILS:-${PEOPLE_ADMIN_EMAILS:-}}
      PAYROLL_ADMIN_EMAILS: ${PAYROLL_ADMIN_EMAILS:-}
      HR_DATA_KEY: ${HR_DATA_KEY:-}
      # Paid pay runs post a journal to Books when the Books service token is set.
      BOOKS_INTERNAL_URL: ${BOOKS_INTERNAL_URL:-http://books:3055}
      BOOKS_SVC_TOKEN: ${BOOKS_SVC_TOKEN:-}

  # Microsoft Whiteboard equivalent: an infinite canvas (Excalidraw) that everyone on a board draws
  # on at once, with sticky notes, templates, sharing, copies saved to Drive, and a board for each
  # meeting and chat. Sticky-note ideas use the suite's AI_* model (WHITEBOARD_AI_* to give it its own).
  whiteboard:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-whiteboard:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: whiteboard } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/whiteboard
      WHITEBOARD_AI_PROVIDER: ${WHITEBOARD_AI_PROVIDER:-}
      WHITEBOARD_AI_BASE_URL: ${WHITEBOARD_AI_BASE_URL:-}
      WHITEBOARD_AI_API_KEY: ${WHITEBOARD_AI_API_KEY:-}
      WHITEBOARD_AI_MODEL: ${WHITEBOARD_AI_MODEL:-}

  # Live drawing: the Yjs collaboration server for Whiteboard, reached at whiteboard.<domain>/collab.
  whiteboard-collab:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-whiteboard:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: whiteboard } }
    command: ["node", "server/collab.mjs"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/whiteboard
      COLLAB_ADDRESS: 0.0.0.0
      COLLAB_PORT: "3751"

  # Microsoft 365 admin center and Purview eDiscovery equivalent: people (through the sign-in
  # service's SCIM API), app health, matters, legal holds, retention and cross-app search and export.
  admin:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-admin:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: admin } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_INTERNAL_URL: http://auth:3500
      ADMIN_SCIM_TOKEN: ${ADMIN_SCIM_TOKEN:-${DIRECTORY_SCIM_TOKEN:-}}
      ADMIN_EXPORT_DIR: /data/admin
    volumes:
      - admin-exports:/data/admin

  # Microsoft Search and Copilot equivalent: one search box across the content apps for the
  # signed-in person (each app answers only with what that person can open), and an assistant
  # that answers from those results, and the Copilot panel in every app's header (answers, summaries,
  # and actions in To Do, Calendar, Chat, Planner and Mail that run only after the person confirms).
  # It uses the suite's AI_* model (SEARCH_AI_* to give it its own).
  search:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-search:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    depends_on: []
    build: { <<: *next-build, args: { APP: search } }
    environment:
      <<: *app-env
      SEARCH_AI_PROVIDER: ${SEARCH_AI_PROVIDER:-}
      SEARCH_AI_BASE_URL: ${SEARCH_AI_BASE_URL:-}
      SEARCH_AI_API_KEY: ${SEARCH_AI_API_KEY:-}
      SEARCH_AI_MODEL: ${SEARCH_AI_MODEL:-}
      SEARCH_APP_URLS: ${SEARCH_APP_URLS:-}

  # Power Automate equivalent: flows that act across the suite and outside services. Flow is the
  # suite-facing app (your flows, recipes, run history, the Synergy steps); the designer and the
  # engine that runs flows are Activepieces Community Edition (MIT), served at flow-studio.
  # The engine, its database and its queue sit on their own network, so a flow can't reach the
  # suite's database or apps directly; Synergy steps go through Flow, which acts as the flow's owner.
  flow:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-flow:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    depends_on: [flow-engine]
    build: { <<: *next-build, args: { APP: flow } }
    networks: [default, flow]
    environment:
      <<: *app-env
      # Signs people in to the engine and makes their Synergy keys; changing it revokes every key.
      FLOW_SECRET: ${FLOW_SECRET:-}
      FLOW_ENGINE_URL: http://flow-engine:80
      FLOW_INTERNAL_URL: http://flow:3780
      FLOW_ENGINE_VERSION: ${FLOW_ENGINE_VERSION:-0.92.3}
      FLOW_APP_URLS: ${FLOW_APP_URLS:-}

  flow-engine:
    image: ${FLOW_ENGINE_IMAGE:-ghcr.io/activepieces/activepieces}:${FLOW_ENGINE_VERSION:-0.92.3}
    restart: unless-stopped
    depends_on:
      flow-db: { condition: service_healthy }
      flow-redis: { condition: service_healthy }
    networks: [flow]
    environment:
      AP_EDITION: ce
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: https://flow-studio.${SUITE_DOMAIN}
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: flow-db
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:-}
      AP_REDIS_HOST: flow-redis
      AP_REDIS_PORT: "6379"
      # 32 hex characters; encrypts the connections people save in the designer.
      AP_ENCRYPTION_KEY: ${FLOW_ENCRYPTION_KEY:-}
      AP_JWT_SECRET: ${FLOW_JWT_SECRET:-}
      # Flow creates each person's engine account; the gateway blocks the engine's own sign-up page.
      AP_ALLOW_OPEN_SIGN_UP: "true"
      AP_TELEMETRY_ENABLED: "false"
      # Code steps run in V8 isolates, without the engine's environment or network.
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: ${FLOW_POLL_MINUTES:-5}
    volumes:
      - flow-cache:/usr/src/app/cache

  flow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [flow]
    environment:
      POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:-}
      POSTGRES_DB: activepieces
    volumes:
      - flow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  flow-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [flow]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Power BI equivalent: dashboards and reports over the suite's business data. The report
  # designer and charts are Metabase (open source edition, AGPL), served at /studio on Insights'
  # own host; Insights signs people in to it with their suite account and connects Books, CRM,
  # Desk, Base, Planner, Forms and Trust as read-only sources (INSIGHTS_SOURCES picks others).
  insights:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-insights:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: insights } }
    environment:
      <<: *app-env
      # Derives every password and key Insights uses with Metabase. openssl rand -hex 32
      INSIGHTS_SECRET: ${INSIGHTS_SECRET:-}
      METABASE_INTERNAL_URL: http://metabase:3000
      # A superuser connection without a database name: Insights gives its read-only role
      # access to each source's safe columns, and Metabase connects as that role.
      INSIGHTS_PG_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432
      INSIGHTS_SOURCES: ${INSIGHTS_SOURCES:-}
      INSIGHTS_ADMIN_EMAILS: ${INSIGHTS_ADMIN_EMAILS:-${ADMIN_EMAILS:-${SEED_ADMIN_EMAIL:-}}}
      INSIGHTS_ANALYST_EMAILS: ${INSIGHTS_ANALYST_EMAILS:-}
      INSIGHTS_SYNC_MINUTES: ${INSIGHTS_SYNC_MINUTES:-}

  # Insights' reporting engine. Its own settings, questions and dashboards live in the metabase
  # database. Not published: Caddy serves it at https://insights.SUITE_DOMAIN/studio.
  metabase:
    image: metabase/metabase:v0.64.2.7
    restart: unless-stopped
    depends_on:
      metabase-db: { condition: service_completed_successfully }
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: postgres
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_SITE_URL: https://insights.${SUITE_DOMAIN}/studio
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # Public links would open reports without a suite sign-in.
      MB_ENABLE_PUBLIC_SHARING: "false"
      # No sample database or example dashboards; the suite's own data is connected instead.
      MB_LOAD_SAMPLE_CONTENT: "false"
      JAVA_OPTS: ${INSIGHTS_JAVA_OPTS:--Xmx1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # Makes the metabase database on installs that started before Insights. Runs once per `up`.
  metabase-db:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'metabase'\" | grep -q 1 || psql -c 'CREATE DATABASE metabase'"]

  # Dynamics 365 Sales equivalent: accounts, contacts, leads, the opportunity pipeline and
  # activities. Lead scoring uses the suite's AI_* model (CRM_AI_* to give CRM its own).
  crm:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-crm:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: crm } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/crm
      CRM_API_TOKEN: ${CRM_API_TOKEN:-}
      CRM_INTAKE_OWNER: ${CRM_INTAKE_OWNER:-}
      CRM_AI_PROVIDER: ${CRM_AI_PROVIDER:-}
      CRM_AI_BASE_URL: ${CRM_AI_BASE_URL:-}
      CRM_AI_API_KEY: ${CRM_AI_API_KEY:-}
      CRM_AI_MODEL: ${CRM_AI_MODEL:-}

  # Dynamics 365 Customer Service equivalent: tickets from email, the web and the API, canned
  # replies and a public knowledge base at /kb. Email intake and replies are off until the
  # DESK_IMAP_* and DESK_SMTP_* settings point at a support mailbox.
  desk:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-desk:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: desk } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/desk
      DESK_API_TOKEN: ${DESK_API_TOKEN:-}
      DESK_IMAP_HOST: ${DESK_IMAP_HOST:-}
      DESK_IMAP_PORT: ${DESK_IMAP_PORT:-}
      DESK_IMAP_USER: ${DESK_IMAP_USER:-}
      DESK_IMAP_PASSWORD: ${DESK_IMAP_PASSWORD:-}
      DESK_IMAP_FOLDER: ${DESK_IMAP_FOLDER:-}
      DESK_IMAP_POLL_SECONDS: ${DESK_IMAP_POLL_SECONDS:-}
      DESK_SMTP_HOST: ${DESK_SMTP_HOST:-}
      DESK_SMTP_PORT: ${DESK_SMTP_PORT:-}
      DESK_SMTP_USER: ${DESK_SMTP_USER:-}
      DESK_SMTP_PASSWORD: ${DESK_SMTP_PASSWORD:-}
      DESK_SMTP_FROM: ${DESK_SMTP_FROM:-}

  # Dynamics 365 Supply Chain Management equivalent: manufacturing (bills of materials,
  # routings, work orders, MRP) and assets (register, preventive maintenance, repairs).
  # Stock is kept in Commerce once COMMERCE_SVC_TOKEN is set (Commerce posts the journals to
  # Books); with BOOKS_SVC_TOKEN set, assets can be sent to Books' fixed-asset register.
  ops:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-ops:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: ops } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ops
      OPS_API_TOKEN: ${OPS_API_TOKEN:-}
      OPS_BOOKS_URL: ${OPS_BOOKS_URL:-http://books:3055}
      BOOKS_SVC_TOKEN: ${BOOKS_SVC_TOKEN:-}
      OPS_COMMERCE_URL: ${OPS_COMMERCE_URL:-http://commerce:3730}
      COMMERCE_SVC_TOKEN: ${COMMERCE_SVC_TOKEN:-}
      OPS_WIP_ACCOUNT: ${OPS_WIP_ACCOUNT:-}
      OPS_MAINTENANCE_ACCOUNT: ${OPS_MAINTENANCE_ACCOUNT:-}

  # Dynamics 365 Commerce and Supply Chain equivalent: products, stock across locations,
  # purchase orders, a point-of-sale register at /pos and an online store at /store. Sales,
  # refunds, deliveries and stock changes post to Books as journal entries (BOOKS_SVC_TOKEN).
  # Online card payment needs a payment provider at COMMERCE_CHECKOUT_URL; without one,
  # shoppers order and pay at pickup or on delivery.
  commerce:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-commerce:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: commerce } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/commerce
      BOOKS_INTERNAL_URL: ${BOOKS_INTERNAL_URL:-http://books:3055}
      BOOKS_SVC_TOKEN: ${BOOKS_SVC_TOKEN:-}
      COMMERCE_CHECKOUT_URL: ${COMMERCE_CHECKOUT_URL:-}
      COMMERCE_CHECKOUT_TOKEN: ${COMMERCE_CHECKOUT_TOKEN:-}
      COMMERCE_SVC_TOKEN: ${COMMERCE_SVC_TOKEN:-}

  # Outlook equivalent: the web mailbox, backed by the Stalwart mail server below.
  mail:
    image: ${SYNERGY_REGISTRY:-ghcr.io/synergytech0}/synergysuite-mail:${SYNERGY_IMAGE_TAG:-latest}
    <<: *next
    build: { <<: *next-build, args: { APP: mail } }
    depends_on:
      postgres: { condition: service_healthy }
      stalwart-init: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mail
      # Draft with Copilot in compose: the AI_* model, or these to give Mail its own.
      MAIL_AI_PROVIDER: ${MAIL_AI_PROVIDER:-}
      MAIL_AI_BASE_URL: ${MAIL_AI_BASE_URL:-}
      MAIL_AI_API_KEY: ${MAIL_AI_API_KEY:-}
      MAIL_AI_MODEL: ${MAIL_AI_MODEL:-}
      # Demo mode only lets mail go to this domain.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      # Encrypts the passwords of outside accounts users connect. openssl rand -base64 32
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?set MAIL_ENCRYPTION_KEY}
      MAIL_IMAP_HOST: stalwart
      MAIL_IMAP_PORT: "993"
      MAIL_SMTP_HOST: stalwart
      MAIL_SMTP_PORT: "465"
      # Stalwart's certificate is self-signed until you give it a real one; this hop stays on the compose network.
      MAIL_SUITE_TLS_INSECURE: ${MAIL_SUITE_TLS_INSECURE:-true}
      MAIL_SUITE_AUTH: master
      MAIL_MASTER_USER: webmail@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD:?set MAIL_MASTER_PASSWORD}
      # Creates each user's mailbox the first time they open Mail.
      MAIL_ADMIN_URL: http://stalwart:8080
      MAIL_ADMIN_USER: postmaster@${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:?set STALWART_ADMIN_PASSWORD}
      # Suggests recipients from Contacts as you type; Mail works without it.
      CONTACTS_INTERNAL_URL: http://contacts:3190

  # Mail server (SMTP, IMAP, JMAP). Settings live in its database; deploy/stalwart/plan.template.ndjson
  # is applied on every start by stalwart-init. Its admin UI is on 127.0.0.1:8080 (log in as admin).
  stalwart:
    image: stalwartlabs/stalwart:v0.16.26
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mx.${SUITE_DOMAIN}}
    environment:
      STALWART_HOSTNAME: ${MAIL_HOSTNAME:-mx.${SUITE_DOMAIN}}
      STALWART_RECOVERY_ADMIN: admin:${STALWART_ADMIN_PASSWORD:?set STALWART_ADMIN_PASSWORD}
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
    ports:
      - "${MAIL_SMTP_PUBLISH:-25}:25"      # incoming mail from the internet
      - "${MAIL_SUBMISSION_PUBLISH:-465}:465"  # sending from desktop and phone clients (TLS)
      - "${MAIL_IMAPS_PUBLISH:-993}:993"   # reading from desktop and phone clients (TLS)
      - "127.0.0.1:${MAIL_ADMIN_PUBLISH:-8080}:8080"  # admin UI and API; keep private
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Fills in the setup plan from .env, then applies it. Both run once per `up` and exit.
  stalwart-plan:
    image: stalwartlabs/stalwart:v0.16.26
    user: "0"
    # Read with any CR stripped, so a CRLF checkout on Windows still runs.
    entrypoint: ["sh", "-c", "tr -d '\\r' < /stalwart/render.sh | sh"]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${SUITE_DOMAIN}}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mx.${SUITE_DOMAIN}}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD}
      # 1: also refuse relaying and keep every message on this server (stalwart/plan.demo.ndjson).
      DEMO_MODE: ${DEMO_MODE:-}
    volumes:
      - ./stalwart:/stalwart:ro
      - stalwart-plan:/plan
    restart: "no"

  stalwart-init:
    image: stalwartlabs/cli:1.0.13
    depends_on:
      stalwart: { condition: service_healthy }
      stalwart-plan: { condition: service_completed_successfully }
    environment:
      STALWART_URL: http://stalwart:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${STALWART_ADMIN_PASSWORD}
    volumes:
      - stalwart-plan:/plan:ro
    command: ["apply", "--file", "/plan/plan.ndjson", "--no-color"]
    restart: "no"

volumes:
  pgdata: {}
  devices-scep: {}
  devices-mdm: {}
  planner-attachments: {}
  photo-files: {}
  stream-files: {}
  cad-files: {}
  drive-files: {}
  sign-files: {}
  admin-exports: {}
  caddy-data: {}
  flow-cache: {}
  flow-pgdata: {}
  stalwart-data: {}
  stalwart-plan: {}
  sip-valkey-data: {}

networks:
  default: {}
  flow: {}
