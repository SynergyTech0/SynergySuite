<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synergy Meet</title>
<link rel="stylesheet" href="/shared/m3.css">
<style>
  .lobby { max-width: 1040px; margin: 0 auto; padding: 40px 24px; display: flex; gap: 48px; align-items: center; flex-wrap: wrap; }
  .lobby .copy { flex: 1; min-width: 300px; }
  .lobby h1 { font-family: var(--font); font-weight: 400; font-size: 44px; margin: 0 0 16px; line-height: 1.15; }
  .lobby p { font-size: 16px; color: var(--on-surface-variant); margin: 0 0 28px; }
  .preview {
    width: 420px; aspect-ratio: 16/9; background: #202124; border-radius: var(--r-lg);
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .preview .ph { color: #9aa0a6; font-size: 15px; text-align: center; }
  .preview .ctrls { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
  .rbtn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #5f6368;
    background: transparent; color: #fff; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .rbtn.off { background: var(--red); border-color: var(--red); }
  .rbtn.end { background: var(--red); border-color: var(--red); width: 56px; border-radius: 28px; }

  .room { position: fixed; inset: 0; background: #202124; display: none; flex-direction: column; z-index: 500; }
  .room.on { display: flex; }
  .tiles { flex: 1; display: grid; gap: 8px; padding: 12px; align-content: center; }
  .tile { background: #3c4043; border-radius: var(--r-lg); position: relative; overflow: hidden;
          display: flex; align-items: center; justify-content: center; aspect-ratio: 16/9; }
  .tile video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .tile .nm { position: absolute; left: 10px; bottom: 8px; color: #fff; font-size: 13px;
              background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 4px; }
  .tile .big { width: 88px; height: 88px; border-radius: 50%; background: #5f6368; color: #fff;
               display: flex; align-items: center; justify-content: center; font-size: 34px; font-family: var(--font); }
  .roombar { height: 72px; flex: none; display: flex; align-items: center; justify-content: center;
             gap: 12px; color: #fff; position: relative; }
  .roombar .left { position: absolute; left: 20px; font-size: 14px; }
  .roombar .right { position: absolute; right: 20px; display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="app-root">
  <div id="shell"></div>
  <div class="app-body">
    <main class="app-main flat" id="main"></main>
  </div>
</div>
<div class="room" id="room">
  <div class="tiles" id="tiles"></div>
  <div class="roombar">
    <span class="left" id="roomInfo"></span>
    <button class="rbtn" id="rMic"><span class="mi">mic</span></button>
    <button class="rbtn" id="rCam"><span class="mi">videocam</span></button>
    <button class="rbtn" id="rShare"><span class="mi">present_to_all</span></button>
    <button class="rbtn end" id="rEnd"><span class="mi">call_end</span></button>
    <div class="right">
      <button class="rbtn" id="rPeople"><span class="mi">group</span></button>
      <button class="rbtn" id="rChat"><span class="mi">chat</span></button>
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
