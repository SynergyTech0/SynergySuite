<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synergy Workspace</title>
<link rel="stylesheet" href="/shared/m3.css">
<style>
  .launch-hero { padding: 48px 24px 24px; text-align: center; }
  .launch-hero h1 { font-family: var(--font); font-weight: 400; font-size: 44px; margin: 0 0 8px; }
  .launch-hero p { color: var(--on-surface-variant); font-size: 16px; margin: 0; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 12px; max-width: 1080px; margin: 40px auto; padding: 0 24px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 28px 12px; border-radius: var(--r-lg); background: var(--surface);
    border: 1px solid var(--divider); text-decoration: none; color: var(--on-surface);
    transition: box-shadow .18s, transform .18s, border-color .18s;
  }
  .tile:hover { box-shadow: var(--elev-2); border-color: transparent; transform: translateY(-2px); }
  .tile .label { font-family: var(--font); font-size: 15px; font-weight: 500; }
  .tile .sub { font-size: 12px; color: var(--on-surface-variant); text-align: center; }
  .stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 8px auto 48px; }
  .stat { text-align: center; }
  .stat b { font-family: var(--font); font-size: 26px; font-weight: 400; display: block; }
  .stat span { font-size: 12px; color: var(--on-surface-variant); }
</style>
</head>
<body>
<div class="app-root">
  <div id="shell"></div>
  <div class="app-body">
    <main class="app-main flat" style="border-radius:0">
      <div class="launch-hero">
        <h1 class="gsans">Synergy Workspace</h1>
        <p>Everything your team needs, in one place.</p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>
<script type="module">
import { APPS, mountShell, appIcon, el, api } from '/shared/shell.js';

document.getElementById('shell').appendChild(mountShell({ app: 'drive', search: false }));
document.querySelector('.topbar-brand .name').innerHTML =
  'Synergy <span style="font-weight:500;color:var(--on-surface-variant)">Workspace</span>';

const SUB = {
  mail: 'Secure business email', drive: 'Cloud storage for the team',
  docs: 'Documents, together', sheets: 'Spreadsheets and formulas',
  slides: 'Presentations that move', forms: 'Surveys and intake',
  calendar: 'Schedules and rooms', keep: 'Notes and lists',
  tasks: 'Track what is due', contacts: 'Your directory',
  chat: 'Spaces and DMs', meet: 'Video meetings',
  sites: 'Internal sites', groups: 'Mailing lists',
  vault: 'Retention and eDiscovery', admin: 'Manage the org',
};

const grid = document.getElementById('grid');
for (const a of APPS)
  grid.appendChild(el('a', { class: 'tile', href: a.url },
    appIcon(a, 56), el('span', { class: 'label' }, a.name),
    el('span', { class: 'sub' }, SUB[a.id] || '')));

const s = await api.get('/admin/stats');
const stats = document.getElementById('stats');
for (const [label, v] of [['Files', s.files], ['Users', s.users], ['Events', s.events],
                          ['Messages', s.messages], ['Spaces', s.spaces], ['Groups', s.groups]])
  stats.appendChild(el('div', { class: 'stat' }, el('b', {}, String(v)), el('span', {}, label)));
</script>
</body>
</html>
