<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synergy Admin</title>
<link rel="stylesheet" href="/shared/m3.css">
<style>
  .adm-wrap { padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--r-lg); padding: 20px; }
  .stat-card b { font-family: var(--font); font-size: 32px; font-weight: 400; display: block; }
  .stat-card span { color: var(--on-surface-variant); font-size: 13px; }
  table.adm { width: 100%; border-collapse: collapse; background: var(--surface);
              border: 1px solid var(--divider); border-radius: var(--r-lg); overflow: hidden; }
  table.adm th { text-align: left; font-size: 12px; font-weight: 500; color: var(--on-surface-variant);
                 padding: 12px 16px; border-bottom: 1px solid var(--divider); background: var(--surface-c-low); }
  table.adm td { padding: 0 16px; height: 56px; font-size: 14px; border-bottom: 1px solid var(--surface-c-low); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
          border-radius: var(--r-full); font-size: 12px; font-weight: 500; }
  .pill.ok { background: #e6f4ea; color: #137333; }
  .pill.warn { background: #fef7e0; color: #b06000; }
  .pill.bad { background: #fce8e6; color: #c5221f; }
  :root[data-theme="dark"] .pill.ok { background: #0d3b1e; color: #81c995; }
  :root[data-theme="dark"] .pill.warn { background: #3d2e00; color: #fdd663; }
  :root[data-theme="dark"] .pill.bad { background: #4a1512; color: #f28b82; }
  .log { font-family: 'Roboto Mono', Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="app-root">
  <div id="shell"></div>
  <div class="app-body">
    <nav class="nav" id="nav" style="width:256px"></nav>
    <main class="app-main" id="main"></main>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
