<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synergy Keep</title>
<link rel="stylesheet" href="/shared/m3.css">
<style>
  .composer {
    max-width: 600px; margin: 24px auto 32px; background: var(--surface);
    border: 1px solid var(--outline-variant); border-radius: var(--r-md);
    box-shadow: var(--elev-1); padding: 12px 16px;
  }
  .composer input, .composer textarea {
    width: 100%; border: none; outline: none; background: transparent;
    font-family: var(--font-body); color: var(--on-surface); resize: none;
  }
  .composer .t { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .masonry { columns: 240px; column-gap: 16px; padding: 0 24px 48px; }
  .note {
    break-inside: avoid; margin-bottom: 16px; border: 1px solid var(--outline-variant);
    border-radius: var(--r-md); padding: 12px 16px; cursor: pointer; position: relative;
    transition: box-shadow .15s;
  }
  .note:hover { box-shadow: var(--elev-2); }
  .note h4 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .note p { margin: 0; font-size: 14px; white-space: pre-wrap; line-height: 1.4; }
  .note .acts { display: flex; gap: 2px; margin-top: 10px; opacity: 0; transition: opacity .15s; }
  .note:hover .acts { opacity: 1; }
  .note .pin { position: absolute; top: 6px; right: 6px; opacity: 0; }
  .note:hover .pin { opacity: 1; }
  .note.pinned .pin { opacity: 1; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 2px 0; }
  .chk.done { text-decoration: line-through; color: var(--on-surface-variant); }
  .section-label { padding: 0 28px 8px; font-size: 11px; letter-spacing: .8px;
                   color: var(--on-surface-variant); text-transform: uppercase; }
</style>
</head>
<body>
<div class="app-root">
  <div id="shell"></div>
  <div class="app-body">
    <nav class="nav" id="nav" style="width:256px"></nav>
    <main class="app-main" id="main"></main>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
