name: Deploy SynergySign
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ai_docusign_clone
            
            echo "📦 Pulling latest changes..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            echo "🔧 Generating Prisma client..."
            npx prisma generate
            
            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy
            
            echo "🏗️ Building application..."
            npm run build
            
            echo "🔄 Managing PM2 process..."
            if pm2 describe synergysign > /dev/null 2>&1; then
              echo "Process exists, restarting..."
              pm2 restart synergysign
            else
              echo "Process doesn't exist, creating new PM2 process..."
              pm2 start npm --name synergysign -- start
            fi
            pm2 save
            pm2 list
            
            echo "✅ Deployment complete!"
